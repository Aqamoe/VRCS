<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f8fb" />
    <title>VRCS</title>
    <script src="/theme-boot.js"></script>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      html { color-scheme: light; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) { color-scheme: dark; }
      }
      body { background: #f5f8fb; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) body { background: #282c33; }
      }
      .startup-shell {
        display: grid;
        width: 100%;
        height: 100%;
        place-content: center;
        place-items: center;
        gap: 24px;
        color: #17617D;
        font: 600 18px/1 "Segoe UI", "Yu Gothic UI", "Meiryo UI", "Microsoft YaHei UI", sans-serif;
        letter-spacing: 0.08em;
      }
      .startup-logo {
        display: block;
        width: min(340px, 68vw);
        height: auto;
      }
      .startup-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid #DFF6FF;
        border-top-color: #74D6FF;
        border-radius: 50%;
        animation: startup-spin 720ms linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) .startup-shell { color: #74D6FF; }
        html:not([data-theme="light"]) .startup-spinner {
          border-color: rgba(116, 214, 255, 0.3);
        }
      }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .startup-spinner { animation-duration: 1600ms; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-shell" role="status" aria-label="Starting VRCS">
        <img class="startup-logo" src="/logos/VRCS_Logo.svg" alt="VRCS" />
        <i class="startup-spinner" aria-hidden="true"></i>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
